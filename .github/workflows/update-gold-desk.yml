name: 24/7 XAUUSD Gold Desk Cloud Cron

on:
  schedule:
    # Run every 4 hours from Monday to Friday (trading days)
    - cron: '0 */4 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

permissions:
  contents: write

jobs:
  update-gold-desk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Multi-Agent Gold Desk Live Refresh
        run: node scripts/update-gold-desk.mjs

      - name: Commit & Push Updated Market Intelligence
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/xauusd-desk/
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-refresh XAUUSD Multi-Agent Desk live intelligence [skip ci]"
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git push origin $CURRENT_BRANCH
          fi
