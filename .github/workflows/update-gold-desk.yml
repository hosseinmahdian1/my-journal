name: 24/7 XAUUSD Gold Desk Cloud Cron

on:
  schedule:
    # Run every 4 hours from Monday to Friday (trading sessions)
    - cron: '0 */4 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

permissions:
  contents: write

jobs:
  update-gold-desk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Execute Multi-Agent Gold Desk Live Refresh
        run: node scripts/update-gold-desk.mjs

      - name: Build Next.js Production Distribution
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=trading-journal --commit-dirty=true
        continue-on-error: true

      - name: Commit & Push Updated Market Intelligence
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/xauusd-desk/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-refresh XAUUSD Multi-Agent Desk live intelligence [skip ci]" && git push origin main)
